<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="dashboard">
    <h1>To-Do List</h1>
    <form id="task-form" autocomplete="off">
      <label for="task-input" class="visually-hidden">Task description</label>
      <input id="task-input" type="text" maxlength="200" placeholder="What needs to be done?" required>
      <button type="submit">Add Task</button>
    </form>
    <ul id="task-list" aria-live="polite"></ul>
    <p id="empty-message" hidden>No tasks yet.</p>
  </main>
  <script src="tasks.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
